name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs rivet
        shell: bash
      - name: Verify release version alignment
        run: bash scripts/check-release-version.sh
        shell: bash
      - name: Compile backend
        run: raco make app/core/*.rkt app/update.rkt app/backend.rkt
        shell: bash
      - name: Gallery data is fresh
        run: racket scripts/gen-gallery.rkt --check
        shell: bash
      - name: Run tests
        run: raco test tests/
        shell: bash

  linux-host:
    name: Linux host (official build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@main
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own.
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs rivet
      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev zlib1g-dev liblz4-dev libncurses-dev libxtst-dev
      - name: raco rivet doctor
        shell: bash
        run: raco rivet doctor
      - name: raco rivet build
        shell: bash
        run: raco rivet build
      - name: Verify staged artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -x .rivet/stage/RivetHost || { echo "staged RivetHost missing" >&2; find .rivet -maxdepth 3 -print >&2; exit 1; }
          echo "host binary: .rivet/stage/RivetHost"
          test -f .rivet/stage/runtime/petite.boot
          test -f .rivet/stage/runtime/scheme.boot
          test -f .rivet/stage/runtime/racket.boot
          test -f .rivet/stage/res/core.zo

  macos-host:
    name: macOS host compile smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Swift syntax smoke
        run: |
          # Source-only syntax validation of the host sources without the
          # full SwiftPM graph (which needs the staged Racket framework).
          swiftc -version
          for f in macos-host/Sources/RivetHost/*.swift; do
            xcrun swift-frontend -typecheck "$f" 2>/dev/null || \
              echo "::warning::$f needs the full swift build (skipped: missing Rivet runtime graph)"
          done

  windows-host:
    name: Windows host compile smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build WinUI host
        working-directory: windows
        env:
          # Windows App SDK + Rivet host build need the generated .g.h/.g.cpp
          # from a full raco rivet build; msbuild here exercises the XAML
          # compiler and C++20 sources.
          RIVET_SKIP_NATIVE: '1'
        run: msbuild RivetHost.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        continue-on-error: true

  plugin-fixture:
    name: FPP1 fixture plugin end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs rivet
      - name: Install fixture plugin
        run: |
          mkdir -p /tmp/fulcrum-fixture/plugins
          cp -r gallery/epoch /tmp/fulcrum-fixture/plugins/epoch
      - name: Run plugin tests against the fixture layout
        run: raco test tests/plugins-test.rkt
        env:
          FULCRUM_DATA_DIR: /tmp/fulcrum-fixture
